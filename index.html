      setTimeout(function () {

        document.body.innerHTML = '<div style="font:18px/1.6 Segoe UI,sans-serif;max-width:640px;margin:12vh auto;padding:32px;border-radius:20px;background:#fff4ee;color:#2a2142;box-shadow:0 10px 40px rgba(0,0,0,.15)"><h2 style="margin-top:0">LUMA RIFT needs to be launched</h2><p>This page was opened directly from disk, so the browser blocked the game scripts.</p><p><b>Easiest:</b> double-click <code>Play.bat</code> in the game folder.</p><p>Or in a terminal inside the folder run <code>npm run dev</code> and open <code>http://localhost:5173</code>.</p><p>Or run <code>npm run build</code> once and open <code>dist/index.html</code>.</p></div>';
      }, 2500);
